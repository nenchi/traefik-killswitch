<!doctype html>
<!--
  Example maintenance page for traefik-killswitch. Copy it, edit the text, and point
  `maintenanceFile` at your copy. Keep it self-contained: while a site is in maintenance
  every request to it returns this page, so CSS, images or fonts hosted on that site won't load.
  Inline everything (images as data: URIs or inline SVG). Edits apply immediately,
  with no Traefik restart.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Down for maintenance</title>
<style>
  :root {
    --bg: #f6f7f9; --card: #fff; --text: #1d2330; --muted: #5d6675; --accent: #d9822b; --border: #e3e6eb;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #14171c; --card: #1d2128; --text: #e8eaee; --muted: #a0a8b5; --accent: #f0a04b; --border: #2c323b; }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px;
    background: var(--bg); color: var(--text);
    font: 16px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  main {
    max-width: 34rem; width: 100%; text-align: center; padding: 2.5rem 2rem;
    background: var(--card); border: 1px solid var(--border); border-radius: 14px;
  }
  svg { width: 56px; height: 56px; color: var(--accent); }
  h1 { font-size: 1.6rem; margin: 1rem 0 .5rem; }
  p { color: var(--muted); margin: .5rem 0; }
  .eta { display: inline-block; margin-top: 1rem; padding: .35rem .9rem; border-radius: 999px;
         background: color-mix(in srgb, var(--accent) 15%, transparent); color: var(--text); font-weight: 600; }
  a { color: var(--accent); }
</style>
</head>
<body>
<main>
  <!-- wrench icon, inline so it loads while the site is down -->
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    <path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/>
  </svg>
  <h1>We'll be right back</h1>
  <p>This site is down for maintenance. Your data is safe, and we're working to bring it back as soon as possible.</p>
  <!-- Edit or delete the next line -->
  <span class="eta">Expected back: soon</span>
</main>
</body>
</html>
