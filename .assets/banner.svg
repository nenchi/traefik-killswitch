    <rect width="64" height="64" rx="12" fill="#c62828"/>
    <path d="M32 12v20" stroke="#fff" stroke-width="6" stroke-linecap="round"/>
    <path d="M21 20a16 16 0 1 0 22 0" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round"/>
  </g>
  <g font-family="DejaVu Sans, Helvetica, Arial, sans-serif">
