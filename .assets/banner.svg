<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640">
  <rect width="1280" height="640" fill="#14171c"/>
  <rect x="40" y="40" width="1200" height="560" rx="28" fill="#1d2128" stroke="#2c323b" stroke-width="2"/>
  <!-- icon (same as icon.svg), 224px -->
